AWSTemplateFormatVersion: '2010-09-09'
Description: App Stack - Spay

Resources:

  PublicSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public Access
      VpcId: !ImportValue Spay-VPC
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  PrivateSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Access
      VpcId: !ImportValue Spay-VPC

  PublicEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c02fb55956c7d316
      SubnetId: !ImportValue Spay-PublicSubnet
      SecurityGroupIds:
        - !Ref PublicSG

  PrivateEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c02fb55956c7d316
      SubnetId: !ImportValue Spay-PrivateSubnet
      SecurityGroupIds:
        - !Ref PrivateSG


